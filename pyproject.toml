[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkrot"
version = "2.1.0"
description = "Find broken links in Markdown and HTML files — with Wayback Machine fallback, interactive fixer, and per-file health reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "iamgeetarted", email = "marktimothydorsey@gmail.com"}]
keywords = ["links", "markdown", "html", "broken", "deadlink", "linkchecker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = [
    "rich>=12.0",
    "httpx[http2]>=0.27",
    "anthropic>=0.20.0",
]

[project.scripts]
linkrot = "linkrot.cli:entry_point"

[project.urls]
Homepage = "https://github.com/iamgeetarted/linkrot"
